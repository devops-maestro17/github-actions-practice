run-name: CI Pipeline by @${{ github.actor }} on ${{ github.ref_name }}
name: Master CI/CD Workflow

on:
    push:
        branches: [ main ]
    pull_request: 
        branches: [ main ]
        paths: [ 'src/**' ]
    workflow_dispatch:
        inputs:
            environment:
                type: choice
                options:
                    - staging
                    - production

jobs: 
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Start Linting for repository
              env:
                REPO_NAME: ${{ github.repository }}
              run: echo "Starting Linting for repository $REPO_NAME"
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Run Linting checks
              run: echo "Running Linting checks"

    test:
        needs: [ lint ]
        runs-on: ubuntu-latest
        # This job now ONLY runs on PRs 
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Run Unit Tests
              run: echo "Running PR-specific validation testsss..."

    deploy:
        needs: [ test ]
        runs-on: ubuntu-latest
        # Only runs on push or manual trigger
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        steps:
            - name: Deploy
              run: echo "Deploying to ${{ inputs.environment }}"